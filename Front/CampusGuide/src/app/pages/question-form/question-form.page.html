<ion-content [fullscreen]="true">
  <app-header></app-header>
  <h2>Upload Questions</h2>
  <form [formGroup]="questionForm" (ngSubmit)="onSubmit()">
    <ion-item>
      <ion-input label="Question Name" formControlName="title" type="text" label-placement="floating" fill="outline" required></ion-input>
    </ion-item>
    <ion-note *ngIf="questionForm.get('title')?.hasError('required') && questionForm.get('title')?.touched" class="note">
      Title is required.
    </ion-note>


    <ion-item>
      <ion-input label="Subject Name" formControlName="subjectName" type="text" label-placement="floating" fill="outline" required></ion-input>
    </ion-item>
    <ion-note *ngIf="questionForm.get('subjectName')?.hasError('required') && questionForm.get('subjectName')?.touched" class="note">
      Subject Name is required.
    </ion-note>


    <ion-item>
      <ion-label position="stacked">Upload File</ion-label>
      <input type="file" (change)="onFileSelected($event)" accept=".doc,.docx,.pdf"/>
    </ion-item>


    <br>


    <ion-button expand="block" type="submit" [disabled]="!selectedFile">Submit Question</ion-button>
  </form>

  <!-- <ion-note *ngIf="questionForm.invalid && questionForm.touched" class="note">
    Please fill out all required fields and select a file before submitting.
  </ion-note> -->
  </ion-content>
